services:
  ceedling-tests:
    user: root
    build:
      context: .
      dockerfile: Dockerfile.ceedling-tests
    volumes:
      - .:/home/dev
    image: ceedling-tests
    working_dir: /home/dev
  stm32-dev:
    user: root
    build:
      context: .
      dockerfile: Dockerfile.stm32-dev
    volumes:
      - .:/home/dev
    ports:
      - "2331:2331"
      - "19021:19021"
    image: stm32-dev
    working_dir: /home/dev
    tty: true
    stdin_open: true
    # command: ["sleep", "infinity"]  # ⬅️ Держит контейнер живым
