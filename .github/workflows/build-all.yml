name: Build All Configurations

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build Docker environment
        run: docker compose build stm32-dev

      - name: Build all configurations
        run: |
          for preset in qemu-f4 stm32f4-debug stm32f4-release; do
            echo "Building preset: $preset"
            docker compose run --rm stm32-dev cmake --preset $preset
            docker compose run --rm stm32-dev cmake --build --preset $preset
            
            mkdir -p artifacts/$preset
            cp -r build/$preset/* artifacts/$preset/ 2>/dev/null || true
          done

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-all-${{ github.ref_name }}
          path: |
            artifacts/stm32f4-release/*.elf
            artifacts/stm32f4-release/*.bin
            artifacts/qemu-f4/*.elf
            artifacts/qemu-f4/*.bin
          retention-days: 30
          if-no-files-found: warn

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare release archives
        run: |
          mkdir -p release-files
          VERSION="${{ github.ref_name }}"
          cd downloaded-artifacts
          zip -r "../release-files/wicked_boot_${VERSION}.zip" *
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }} 
          files: |
            release-files/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
