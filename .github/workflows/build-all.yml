name: Build All Configurations

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Firmware version: $VERSION"

      - name: Build Docker environment
        run: docker compose build stm32-dev

      - name: Build all configurations
        run: |
          for preset in qemu-f4 stm32f4-debug stm32f4-release; do
            echo "=========================================="
            echo "Building preset: $preset"
            echo "=========================================="
            
            docker compose run --rm stm32-dev rm -rf build
            docker compose run --rm stm32-dev cmake --preset $preset
            docker compose run --rm stm32-dev cmake --build --preset $preset
            
            mkdir -p artifacts/$preset
            cp -r build/$preset/* artifacts/$preset/ 2>/dev/null || true
          done

      - name: Upload stm32f4-release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-stm32f4-release-v${{ steps.version.outputs.version }}
          path: |
            artifacts/stm32f4-release/*.elf
            artifacts/stm32f4-release/*.hex
            artifacts/stm32f4-release/*.bin
            artifacts/stm32f4-release/*.map
          retention-days: 30
          if-no-files-found: warn

      - name: Upload debug map files
        uses: actions/upload-artifact@v4
        with:
          name: debug-maps-v${{ steps.version.outputs.version }}
          path: |
            artifacts/stm32f4-debug/*.map
          retention-days: 14
          if-no-files-found: warn

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

            - name: Prepare release archives
        run: |
          mkdir -p release-files
          VERSION="${{ steps.version.outputs.version }}"
          
          # Проходим по всем скачанным папкам артефактов автоматически
          for dir in downloaded-artifacts/*; do
            # Извлекаем имя платформы из имени папки
            # Было: firmware-stm32f4-release-v0.0.2 -> Стало: stm32f4 
            dirname=$(basename "$dir")
            platform=$(echo "$dirname" | sed -E 's/firmware-(.*)-release-v.*/\1/')
            
            echo "Обрабатываем платформу: $platform"
            
            # Создаем временную папку для этой платформы
            mkdir -p "release-files/$platform"
            
            # Копируем и переименовываем файлы внутри папки
            for file in "$dir"/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                name="${filename%.*}"
                ext="${filename##*.}"
                
                # Формируем имя: stm32f4_wicked_boot-v0.0.2.bin
                new_name="${platform}_${name}-v${VERSION}.${ext}"
                cp "$file" "release-files/$platform/$new_name"
              fi
            done
            
            # Упаковываем папку платформы в ZIP-архив
            cd release-files
            zip -r "wicked_boot_${platform}_v${VERSION}.zip" "$platform"
            cd ..
          done
          
          echo "Готовые архивы для релиза:"
          ls -la release-files/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.version }}
          files: |
            release-files/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
